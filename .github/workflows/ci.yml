name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate operational files
        run: |
          test -s Dockerfile
          test -s docker-compose.prod.yml
          test -s Caddyfile
          test -s scripts/backup-postgres.sh
          bash -n scripts/backup-postgres.sh
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run test suite
        run: ./mvnw -B test
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find src/main/resources/static -type f -name '*.js' -print0)
      - name: Test CSV import interactions
        run: node --test src/test/js/lancamentos.test.cjs
      - name: Reject unsafe HTML injection APIs
        run: |
          if find src/main/resources/static -type f -name '*.js' -exec grep -nE "innerHTML|outerHTML|insertAdjacentHTML" {} +; then
            exit 1
          fi
