name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run test suite
        run: ./mvnw -B test
      - name: Check JavaScript syntax
        run: for f in src/main/resources/static/*.js; do node --check "$f"; done
      - name: Reject unsafe HTML injection APIs
        run: if grep -rnE "innerHTML|outerHTML|insertAdjacentHTML" src/main/resources/static/*.js; then exit 1; fi
