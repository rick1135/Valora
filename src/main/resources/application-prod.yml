server:
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      roles: ADMIN
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: valora-api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  headers:
    hsts-enabled: ${SECURITY_HSTS_ENABLED:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-none}] %logger{36} - %msg%n"

brapi:
  token: ${BRAPI_TOKEN:}

provents:
  sync:
    cron: ${PROVENTS_SYNC_CRON:0 15 8 * * *}
    asset-lookback-days: ${PROVENTS_SYNC_ASSET_LOOKBACK_DAYS:365}
    jcp-rate-is-gross: ${PROVENTS_SYNC_JCP_RATE_IS_GROSS:true}
